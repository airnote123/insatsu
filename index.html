<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>給食放送 印刷専用</title>

<style>
body {
  font-family: sans-serif;
}

input, textarea, button {
  width: 100%;
  margin-bottom: 10px;
}

textarea {
  height: 180px;
}

/* 印刷用 */
@media print {
  body {
    margin: 20mm;
    font-size: 14px;
    line-height: 1.7;
  }

  input, textarea, button {
    display: none;
  }

  .print-page {
    page-break-after: always;
  }

  .screen-hidden {
    display: block;
  }
}

/* 画面では隠す */
.screen-hidden {
  display: none;
}

.print-page {
  border: 1px solid #000;
  padding: 10mm;
}

h1 {
  text-align: center;
  font-size: 18px;
}

h2 {
  border-bottom: 1px solid #000;
  font-size: 15px;
}

.box {
  white-space: pre-wrap;
}
</style>
</head>

<body>

<h1>給食放送 印刷用アプリ</h1>

<textarea id="jsonInput" placeholder="JSONを貼り付け"></textarea>

<input id="dateInput" placeholder="印刷したい日付（例：3/2）">

<button onclick="buildPrint()">印刷用生成</button>
<button onclick="window.print()">印刷</button>

<div id="output"></div>

<script>
function buildPrint() {
  const output = document.getElementById("output");
  output.innerHTML = "";

  let data;
  try {
    data = JSON.parse(document.getElementById("jsonInput").value);
  } catch {
    alert("JSONが正しくありません");
    return;
  }

  const targetDate = document.getElementById("dateInput").value;

  const ep = data.find(e =>
    e.date === targetDate &&
    (e.number === null || e.number === undefined || e.number === "")
  );

  if (!ep) {
    alert("該当する未設定の放送がありません");
    return;
  }

  const page = document.createElement("div");
  page.className = "print-page screen-hidden";

  page.innerHTML = `
    <h1>給食放送 提出用原稿</h1>
    <div>放送日：${ep.date}</div>
    <div>放送番号：未設定</div>

    <h2>オープニング</h2>
    <div class="box">${ep.opening || ""}</div>

    ${ep.trivia ? `
      <h2>ランチタイム雑学</h2>
      <div class="box">${ep.trivia}</div>
    ` : ""}

    <h2>エンディング</h2>
    <div class="box">${ep.ending || ""}</div>
  `;

  output.appendChild(page);
}
</script>

</body>
</html>
